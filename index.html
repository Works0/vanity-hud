<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COREX//SYNC</title>
    <style>
        body {
            background-image: url('makeupbag1.jpg');
            background-size: 60% auto; 
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #000000;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffffff;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            width: 350px; 
            min-height: 400px;
        }
        .vanity-btn {
            background-color: rgba(0, 0, 0, 0.5);
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 15px;
            margin: 8px;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            width: 140px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>COREX//SYNC</h1>
        <button class="vanity-btn" onclick="send('eyes','style1')">Eye's</button>
        <button class="vanity-btn" onclick="send('brows','style1')">Brow's</button>
    </div>

    <script>
        function send(part, style) {
            // This sends a silent request to your LSL script URL
            fetch(window.location.href, {
                method: 'POST',
                body: "cmd=" + part + ":" + style
            });
            console.log("Sent: " + part + ":" + style);
        }
    </script>
</body>
</html>
