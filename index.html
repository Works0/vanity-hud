<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COREX//SYNC_Makeup_HUD</title>
    <style>
        body {
            background-image: url('makeupbag1.jpg');
            background-size: 60% auto; 
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #000000;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            z-index: 0; /* Behind everything */
        }

        .container {
            position: relative;
            z-index: 10; /* Make sure this is above the overlay */
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffffff;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            width: 350px; 
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            margin-top: 0;
        }

        .button-container {
            position: relative;
            z-index: 20; /* Specifically ensure buttons are clickable */
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }

        .vanity-btn {
            background-color: rgba(0, 0, 0, 0.5);
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 15px 30px;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 140px;
            pointer-events: auto; /* Ensures clicks register */
        }

        .vanity-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>COREX//SYNC</h1>
        <div class="button-container">
            <button class="vanity-btn" onclick="sendCustomData(this, 'eyes', 'style1')">Eye's</button>
            <button class="vanity-btn" onclick="sendCustomData(this, 'brows', 'style1')">Brow's</button>
            <button class="vanity-btn" onclick="sendCustomData(this, 'lashes', 'style1')">Lashes</button>
            <button class="vanity-btn" onclick="sendCustomData(this, 'lips', 'style1')">Lip's</button>
            <button class="vanity-btn" onclick="sendCustomData(this, 'blush', 'style1')">Blush</button>
            <button class="vanity-btn" onclick="sendCustomData(this, 'moles', 'style1')">Moles</button>
            <button class="vanity-btn" onclick="sendCustomData(this, 'tattoos', 'style1')">Tattoo's</button>
        </div>
    </div>

    <iframe name="secret_frame" style="display:none;"></iframe>
    <form id="sl_form" method="POST" target="secret_frame" style="display:none;">
        <input type="hidden" id="payload_data" name="data">
    </form>

    <script>
        function sendCustomData(buttonElement, targetPart, colorName) {
            let simUrl = window.location.hash.substring(1);
            if (!simUrl) { console.log("URL missing"); return; }
            simUrl = decodeURIComponent(simUrl);
            const form = document.getElementById('sl_form');
            const input = document.getElementById('payload_data');
            
            form.action = simUrl;
            input.value = targetPart + "," + colorName;
            form.submit();
        }
    </script>
</body>
</html>
