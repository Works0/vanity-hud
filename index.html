<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Vanity HUD</title>
    <style>
        body {
            /* Replace 'background.jpg' with your filename if different */
            background-image: url('makeupbag1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* The Box Container */
        .container {
            background: rgba(0, 0, 0, 0.5); /* Semi-transparent black background */
            border: 2px solid #ffffff;       /* This is your border */
            border-radius: 15px;             /* Rounded corners */
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            backdrop-filter: blur(5px);      /* Slight glass effect */
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-align: center;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }

        .vanity-btn {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 15px 30px;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 140px;
        }

        .vanity-btn:hover {
            background-color: #ffffff;
            color: #1a1a1a;
        }
    </style>
</head>
<body>

    <!-- Everything is wrapped in this container -->
    <div class="container">
        <h1>COREX//SYNC</h1>

        <div class="button-container">
            <button class="vanity-btn" onclick="sendCustomData(this, 'eyes', 'style1')">Eye's</button>
            <button class="vanity-btn" onclick="sendCustomData(this, 'brows', 'style1')">Brow's</button>
            <button class="vanity-btn" onclick="sendCustomData(this, 'lashes', 'style1')">Lashes</button>
            <button class="vanity-btn" onclick="sendCustomData(this, 'lips', 'style1')">Lip's</button>
            <button class="vanity-btn" onclick="sendCustomData(this, 'blush', 'style1')">Blush</button>
            <button class="vanity-btn" onclick="sendCustomData(this, 'moles', 'style1')">Moles</button>
            <button class="vanity-btn" onclick="sendCustomData(this, 'tattoos', 'style1')">Tattoo's</button>
        </div>
    </div>

    <iframe name="secret_frame" style="display:none;"></iframe>
    <form id="sl_form" method="POST" target="secret_frame" style="display:none;">
        <input type="hidden" id="payload_data" name="data">
    </form>

    <script>
        function sendCustomData(buttonElement, targetPart, colorName) {
            let simUrl = window.location.hash.substring(1);
            if (!simUrl) {
                buttonElement.innerText = "URL BLOCKED";
                buttonElement.style.borderColor = "#ff4444";
                buttonElement.style.color = "#ff4444";
                return;
            }
            simUrl = decodeURIComponent(simUrl);
            const form = document.getElementById('sl_form');
            const input = document.getElementById('payload_data');
            
            form.action = simUrl;
            input.value = targetPart + "," + colorName;
            form.submit();
        }
    </script>
</body>
</html>
