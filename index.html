<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COREX//SYNC</title>
    <style>
        body {
            background-image: url('makeupbag1.jpg');
            background-size: 60% auto; 
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #000000;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffffff;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            width: 350px; 
            min-height: 400px;
        }
        h1 { text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
        .button-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .vanity-btn {
            background-color: rgba(0, 0, 0, 0.5);
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 12px;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            width: 140px;
        }
        .vanity-btn:hover { background-color: #ffffff; color: #000000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>COREX//SYNC</h1>
        <div class="button-container">
            <button class="vanity-btn" onclick="send('eyes', 'style1')">Eye's</button>
            <button class="vanity-btn" onclick="send('brows', 'style1')">Brow's</button>
            <button class="vanity-btn" onclick="send('lashes', 'style1')">Lashes</button>
            <button class="vanity-btn" onclick="send('lips', 'style1')">Lip's</button>
            <button class="vanity-btn" onclick="send('blush', 'style1')">Blush</button>
            <button class="vanity-btn" onclick="send('moles', 'style1')">Moles</button>
            <button class="vanity-btn" onclick="send('tattoos', 'style1')">Tattoo's</button>
        </div>
    </div>

    <script>
        function send(part, style) {
            // This grabs the current Sim URL dynamically
            let simUrl = window.location.hash.substring(1);
            if(!simUrl) return;
            
            fetch(decodeURIComponent(simUrl), {
                method: 'POST',
                body: "data=" + part + "," + style
            });
        }
    </script>
</body>
</html>
