<script>
        function sendCustomData(buttonElement, targetPart, colorName) {
            // Safely grab the hash from the parent or current window location
            let simUrl = window.location.hash ? window.location.hash.substring(1) : "";

            // If the hash isn't on the URL directly, check if it was passed via search params or fallback
            if (!simUrl && window.location.search) {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.has('cap')) {
                    simUrl = urlParams.get('cap');
                }
            }

            // The Visual Tripwire if URL is missing
            if (!simUrl) {
                buttonElement.innerText = "URL BLOCKED";
                buttonElement.style.borderColor = "#ff4444";
                buttonElement.style.color = "#ff4444";
                return;
            }

            // Decode the URL to ensure it is clean
            simUrl = decodeURIComponent(simUrl);

            const form = document.getElementById('sl_form');
            const input = document.getElementById('payload_data');
            
            form.action = simUrl;
            input.value = targetPart + "," + colorName;
            form.submit();

            // Give a subtle visual feedback that click went through
            let originalText = buttonElement.innerText;
            buttonElement.innerText = "SENT";
            setTimeout(() => {
                buttonElement.innerText = originalText;
            }, 600);
        }
    </script>
